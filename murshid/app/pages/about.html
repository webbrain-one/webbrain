<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' murshid: data:; style-src 'self'; script-src 'self'">
<title>{{t:page.about.title}}</title>
<link rel="stylesheet" href="pages.css">
</head>
<body data-page="about">
<main class="wrap">
  <div class="mark"><img src="murshid://assets/icons/murshid.svg" alt=""><span lang="en" dir="ltr">Murshid</span></div>
  <h1>{{rich:page.about.heading}}</h1>
  <p class="lede">{{rich:page.about.lede}}</p>
  <div class="panel" id="info">
    <div class="row"><span class="k">Murshid</span><span class="v" data-k="version" dir="auto">…</span></div>
    <div class="row"><span class="k">Chromium</span><span class="v" data-k="chrome" dir="auto">…</span></div>
    <div class="row"><span class="k">Electron</span><span class="v" data-k="electron" dir="auto">…</span></div>
    <div class="row"><span class="k">WebBrain</span><span class="v" data-k="webBrain" dir="auto">…</span></div>
    <div class="row"><span class="k">WebBrain Companion</span><span class="v" data-k="companion" dir="auto">…</span></div>
    <div class="row"><span class="k">{{t:page.about.platform}}</span><span class="v" data-k="platform" dir="auto">…</span></div>
    <div class="row"><span class="k">{{t:page.about.profile}}</span><span class="v" data-k="profile" dir="auto">…</span></div>
    <div class="row"><span class="k">{{t:page.about.userAgent}}</span><span class="v" data-k="userAgent" dir="auto">…</span></div>
  </div>
  <div class="actions">
    <a class="button primary" href="murshid://updates">{{t:page.updates.check}}</a>
    <a class="button" href="https://github.com/webbrain-one/webbrain">{{t:page.about.source}}</a>
    <a class="button" href="murshid://settings">{{t:page.settingsLink}}</a>
  </div>
</main>
<script src="pages.js"></script>
</body>
</html>
