<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' murshid: data:; style-src 'self'; script-src 'self'">
<title>{{t:page.error.title}}</title>
<link rel="stylesheet" href="pages.css">
</head>
<body data-page="error">
<main class="wrap">
  <div class="mark"><img src="murshid://assets/icons/murshid.svg" alt=""><span lang="en" dir="ltr">Murshid</span></div>
  <h1>{{rich:page.error.heading}}</h1>
  <p class="lede">{{rich:page.error.lede}} <span id="why"></span></p>
  <div class="panel">
    <div class="row"><span class="k">{{t:page.error.address}}</span><span class="v" id="url" dir="ltr"></span></div>
    <div class="row"><span class="k">{{t:page.error.error}}</span><span class="v" id="code" dir="ltr"></span></div>
  </div>
  <div class="actions">
    <button class="button primary" id="retry" type="button">{{t:page.error.retry}}</button>
    <a class="button" href="murshid://newtab">{{t:page.newTab}}</a>
  </div>
</main>
<script src="pages.js"></script>
</body>
</html>
