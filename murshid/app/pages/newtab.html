<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' murshid: data:; style-src 'self'; script-src 'self'">
<title>New Tab</title>
<link rel="stylesheet" href="pages.css">
</head>
<body>
<main class="start">
  <div class="start-inner">
    <img src="murshid://assets/icons/murshid.svg" alt="">
    <h1>Where to, <em>seeker?</em></h1>
    <form class="search" id="search" autocomplete="off">
      <input id="q" type="text" placeholder="Search or type a web address" aria-label="Search or type a web address" autofocus>
      <button type="submit">Go</button>
    </form>
    <div class="actions">
      <button class="button" id="webbrain" type="button">Open WebBrain</button>
      <a class="button" href="murshid://settings">Settings</a>
    </div>
    <p class="hint">WebBrain's new tab page is switched off. Turn it back on in WebBrain → Settings → General.</p>
  </div>
</main>
<script src="pages.js"></script>
</body>
</html>
