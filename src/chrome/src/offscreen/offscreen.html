<!DOCTYPE html>
<html>
<head>
  <!--
    Single offscreen document hosting:
      • offscreen.js — fetch proxy for localhost LLM servers (existing)
      • pdf-extraction-host.js — lazy PDF.js host for Agent text extraction
      • offline-rag-host.js — worker-capable SQLite and semantic retrieval
      • vision-inference-host.js — local WebGPU model worker bridge
      • skill-download.js — validated large-file staging through OPFS + blob URLs
      • emergency-download-host.js — Emergency text pack, PDF, and E5 downloads
      • apocalypse-download-host.js — Wikipedia archive writes that need a Worker
      • recorder.js  — tab/display capture + mic mix + MediaRecorder
      • cloud-bridge.js — outbound localhost WebSocket for managed cloud runs

    Chrome MV3 only allows ONE offscreen document per extension at a time,
    so these responsibilities share this host. Each script binds its own
    runtime.onMessage filter (`offscreen-fetch`, `webgpu-*`, etc.) so they
    don't step on each other's messages.

    Reasons declared at createDocument time cover both code paths up front:
    LOCAL_STORAGE (fetch proxy), WORKERS (model inference), BLOBS (download
    staging), USER_MEDIA (mic), DISPLAY_MEDIA (tab/display capture), and
    AUDIO_PLAYBACK (watch alerts).
  -->
  <script src="offscreen.js"></script>
  <script type="module" src="pdf-extraction-host.js"></script>
  <script type="module" src="offline-rag-host.js"></script>
  <script type="module" src="emergency-download-host.js"></script>
  <script type="module" src="apocalypse-download-host.js"></script>
  <script src="vision-inference-host.js"></script>
  <script src="skill-download.js"></script>
  <script src="recorder.js"></script>
  <script src="cloud-bridge.js"></script>
  <script src="watch-audio.js"></script>
</head>
<body></body>
</html>
