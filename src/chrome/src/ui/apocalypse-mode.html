<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="ap.page_title"></title>
  <script src="theme-bootstrap.js"></script>
  <style>
    :root { --bg:#1a1a2e;--panel:#16213e;--panel2:#1e2746;--text:#e8e8e8;--muted:#a0a0b8;--border:rgba(255,255,255,.08);--accent:#6c63ff;--accent2:#5a52d5;--good:#4caf50;--warn:#ffc870;--bad:#f44336;--header-bg:rgba(26,26,46,.96);--stats-bg:rgba(22,33,62,.76);--link:#9e97ff;--good-link:#d5ffe6;--accent-soft:#a9a3ff;--teal:#60d3b2;color-scheme:dark; }
    :root[data-theme="light"] { --bg:#f7f1e6;--panel:#fffdf8;--panel2:#fdf6e0;--text:#2c1810;--muted:#6b5b47;--border:rgba(89,55,25,.15);--accent:#5b52e8;--accent2:#4a42c4;--good:#2d8866;--warn:#a85f00;--bad:#c5363c;--header-bg:rgba(247,241,230,.96);--stats-bg:rgba(255,253,248,.82);--link:#4a42c4;--good-link:#1f6f4a;--accent-soft:#4a42c4;--teal:#177f69;color-scheme:light; }
    * { box-sizing:border-box; }
    body { margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font-text, system-ui,-apple-system,sans-serif); }
    header { border-bottom:1px solid var(--border);padding:20px max(24px,calc((100vw - 1120px)/2));display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;background:var(--header-bg);z-index:2; }
    .apocalypse-icon { color:var(--warn);font-size:48px;line-height:1; }
    .header-copy { display:grid;gap:1px; }
    .header-copy .muted { font-size:13px; }
    h1,h2,h3,p { margin:0; } h1 { font-size:21px; } h2 { font-size:17px;margin-bottom:12px; } h3 { font-size:14px; }
    main { max-width:1120px;margin:24px auto;padding:0 24px 48px;display:grid;gap:18px; }
    .card { background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px; }
    .section-heading { display:flex;align-items:flex-start;gap:12px;margin-bottom:14px; }
    .section-heading h2 { margin-bottom:2px; }
    .section-icon { width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;border:1px solid rgba(124,114,255,.35);border-radius:9px;background:rgba(124,114,255,.1);color:var(--accent-soft); }
    .section-icon[data-kind="catalog"] { border-color:rgba(96,211,178,.35);background:rgba(96,211,178,.09);color:var(--teal); }
    .section-icon[data-kind="import"] { border-color:rgba(255,180,84,.35);background:rgba(255,180,84,.09);color:var(--warn); }
    .section-icon[data-kind="emergency"] { border-color:rgba(85,199,133,.38);background:rgba(85,199,133,.09);color:var(--good); }
    .section-icon svg { width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round; }
    .hero { display:grid;grid-template-columns:1fr;gap:12px; }
    .hero-overview { display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:20px;align-items:start; }
    .hero-copy { max-width:780px; }
    .library-callout,.emergency-callout-row { display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center; }
    .emergency-callout { display:grid;gap:14px; }
    .library-callout h2,.emergency-callout-row h2 { margin-bottom:2px; }
    .library-callout .button-link { border-color:rgba(96,211,178,.45);color:var(--teal);background:rgba(96,211,178,.1); }
    .library-callout .button-link:hover { border-color:var(--teal);background:rgba(96,211,178,.16); }
    .emergency-callout[data-locked="true"] .emergency-callout-row .section-icon,.emergency-callout[data-locked="true"] .emergency-callout-row h2,.emergency-callout[data-locked="true"] .emergency-callout-row .muted,.emergency-callout[data-locked="true"] .emergency-callout-row .button-link { opacity:.46;filter:saturate(.2); }
    .emergency-callout[data-locked="true"] .emergency-callout-row .button-link { pointer-events:none;cursor:not-allowed; }
    .emergency-gate-reason { margin-top:5px;color:var(--warn);font-size:12px;font-weight:650; }
    .button-link { display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 13px;border:1px solid rgba(85,199,133,.45);border-radius:8px;color:var(--good-link);background:rgba(85,199,133,.1);font-weight:700;text-decoration:none;white-space:nowrap; }
    .button-link:hover { border-color:var(--good);background:rgba(85,199,133,.16); }
    .muted,.meta { color:var(--muted); } .warning { color:var(--warn);margin-top:8px; }
    .toggle { display:flex;gap:10px;align-items:center;font-weight:700; }
    .toggle input { width:42px;height:22px;accent-color:var(--accent); }
    .header-right { display:flex;align-items:center;gap:12px;margin-inline-start:auto; }
    .header-stats { display:flex;align-items:stretch;overflow:hidden;border:1px solid var(--border);border-radius:9px;background:var(--stats-bg); }
    .header-stat { min-width:86px;display:grid;gap:0;padding:5px 9px;border-inline-end:1px solid var(--border); }
    .header-stat:last-child { min-width:132px;border-inline-end:0; }
    .header-stat strong { overflow:hidden;font:750 11px/1.25 var(--font-mono, ui-monospace,SFMono-Regular,Menlo,monospace);text-overflow:ellipsis;white-space:nowrap; }
    .header-stat small { color:var(--muted);font-size:9px;line-height:1.2;white-space:nowrap; }
    .models-readiness { display:inline-flex;align-items:center;gap:7px;padding:4px 9px;border:1px solid currentColor;border-radius:999px;font-size:12px;font-weight:750;white-space:nowrap; }
    .models-readiness-dot { width:7px;height:7px;border-radius:50%;background:currentColor; }
    .models-readiness[data-kind="ready"] { color:var(--good);background:rgba(85,199,133,.09); }
    .models-readiness[data-kind="pending"] { color:var(--warn);background:rgba(255,180,84,.09); }
    .models-readiness[data-kind="disabled"],.models-readiness[data-kind="error"] { color:var(--bad);background:rgba(255,107,120,.09); }
    .local-models { grid-column:1 / -1;width:100%;display:grid;gap:12px; }
    .local-model { width:100%;display:grid;grid-template-columns:42px minmax(0,1fr);gap:14px;align-items:start;padding:16px;border:1px solid var(--border);border-radius:10px;background:var(--panel2); }
    .local-model-icon { width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(124,114,255,.35);border-radius:9px;background:rgba(124,114,255,.1);color:var(--accent-soft); }
    .local-model[data-model-kind="vision"] .local-model-icon { border-color:rgba(96,211,178,.35);background:rgba(96,211,178,.09);color:var(--teal); }
    .local-model[data-model-kind="knowledge"] .local-model-icon { border-color:rgba(255,180,84,.35);background:rgba(255,180,84,.09);color:var(--warn); }
    .local-model[data-model-kind="corpus"] .local-model-icon { border-color:rgba(23,127,105,.35);background:rgba(23,127,105,.09);color:var(--good); }
    .local-model[data-model-kind="semantic"] .local-model-icon { border-color:rgba(124,114,255,.35);background:rgba(124,114,255,.1);color:var(--accent-soft); }
    .local-model-icon svg { width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round; }
    .local-model-body { min-width:0; }
    .local-model-head { display:flex;align-items:baseline;justify-content:space-between;gap:12px; }
    .local-model .meta { margin-top:4px; }
    .model-test-result { min-height:18px;margin-top:8px;color:var(--muted);font-size:12px;font-weight:650; }
    .model-test-result[data-kind="success"] { color:var(--good); }
    .model-test-result[data-kind="error"] { color:var(--bad); }
    .model-actions { display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px; }
    .vision-status { margin-top:8px;color:var(--muted);font-weight:650; }
    .vision-status[data-kind="ready"] { color:var(--good); }
    .vision-status[data-kind="error"] { color:var(--bad); }
    .check { display:flex;gap:8px;align-items:center;min-height:38px;color:var(--text); }
    .check input { accent-color:var(--accent); }
    .controls { display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:14px; }
    label.field { display:grid;gap:5px;color:var(--muted);font-size:12px; }
    button,select,input[type=file],input[type=text],input[type=number] { background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:8px 11px;font:inherit; }
    button { cursor:pointer;font-weight:650; } button.primary { background:var(--accent);border-color:var(--accent);color:#fff; } button.primary:hover:not(:disabled) { background:var(--accent2);border-color:var(--accent2); } button.danger { color:var(--bad); } button:disabled { opacity:.5;cursor:not-allowed; }
    a { color:var(--link); }
    .webgpu-transfer { margin-top:10px; }
    .local-model:has(.webgpu-transfer[data-state=error]) { border-color:rgba(255,107,120,.5); }
    .webgpu-transfer-heading,.webgpu-transfer-status-row,.webgpu-transfer-actions { display:flex;align-items:center;gap:8px; }
    .webgpu-transfer-heading { justify-content:space-between;margin-bottom:10px; }
    .webgpu-transfer-title { font-size:12px;font-weight:700; }
    .webgpu-transfer-status-row { margin-bottom:7px; }
    .webgpu-transfer-dot { width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:var(--muted); }
    .webgpu-transfer[data-state=downloading] .webgpu-transfer-dot { background:var(--teal);box-shadow:0 0 0 4px rgba(96,211,178,.12);animation:webgpu-transfer-pulse 1.25s ease-in-out infinite; }
    .webgpu-transfer[data-state=ready] .webgpu-transfer-dot { background:var(--good); }
    .webgpu-transfer[data-state=paused] .webgpu-transfer-dot,.webgpu-transfer[data-state=stopping] .webgpu-transfer-dot { background:var(--warn); }
    .webgpu-transfer[data-state=error] .webgpu-transfer-dot { background:var(--bad); }
    .webgpu-transfer-status { font-size:12px;font-weight:650; }
    .webgpu-transfer-track { position:relative;height:8px;overflow:hidden;border-radius:999px;background:rgba(128,128,160,.2);box-shadow:inset 0 1px 2px rgba(0,0,0,.18); }
    .webgpu-transfer-fill { width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--teal));transition:width .18s ease; }
    .webgpu-transfer[data-state=downloading][data-indeterminate=true] .webgpu-transfer-fill { width:36%!important;animation:webgpu-transfer-scan 1.15s ease-in-out infinite alternate; }
    .webgpu-transfer-detail { min-height:17px;margin-top:7px;color:var(--muted);font:10px/1.5 var(--font-mono, ui-monospace,SFMono-Regular,Menlo,Consolas,monospace);overflow-wrap:anywhere; }
    .webgpu-transfer-actions { flex-wrap:wrap;margin-top:10px; }
    .webgpu-transfer-actions button { padding:6px 11px; }
    @keyframes webgpu-transfer-pulse { 50% { opacity:.45;transform:scale(.75); } }
    @keyframes webgpu-transfer-scan { from { transform:translateX(-100%); } to { transform:translateX(280%); } }
    @keyframes status-pulse { 50% { opacity:.35;transform:scale(.75); } }
    .list { display:grid;gap:10px;margin-top:12px; }
    .item { border:1px solid var(--border);border-radius:9px;padding:13px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center; }
    .item .meta { font-size:12px;margin-top:3px;overflow-wrap:anywhere; } .actions { display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end; }
    progress { width:100%;height:7px;margin-top:8px;accent-color:var(--accent); }
    .section-status { min-height:20px;margin-top:10px;color:var(--muted);font-size:12px;font-weight:650; }
    .section-status:not(:empty)::before { content:"";display:inline-block;width:7px;height:7px;margin-inline-end:7px;border-radius:50%;background:currentColor;vertical-align:1px; }
    .section-status[data-kind="loading"] { color:var(--teal); }
    .section-status[data-kind="loading"]::before { animation:status-pulse 1.2s ease-in-out infinite; }
    .section-status[data-kind="success"] { color:var(--good); }
    .section-status[data-kind="error"] { color:var(--bad); }
    #notice { min-height:21px;color:var(--muted); } #notice[data-kind=error] { color:var(--bad); } #notice[data-kind=success] { color:var(--good); }
    .empty { color:var(--muted);padding:12px 0; }
    @media(prefers-reduced-motion:reduce){.webgpu-transfer-fill{transition:none}.webgpu-transfer[data-state=downloading] .webgpu-transfer-dot,.webgpu-transfer[data-state=downloading][data-indeterminate=true] .webgpu-transfer-fill,.section-status[data-kind="loading"]::before{animation:none}}
    @media(max-width:920px){.header-stats .header-stat:last-child{display:none}}
    @media(max-width:700px){ header{align-items:flex-start}.header-right{width:100%;margin-inline-start:64px;justify-content:space-between}.header-stat{min-width:74px}.hero-overview,.item,.library-callout,.emergency-callout-row{grid-template-columns:1fr}.local-models{grid-column:1}.actions{justify-content:flex-start}.local-model-head{align-items:flex-start;flex-direction:column;gap:2px}.library-callout .section-icon,.emergency-callout-row .section-icon{display:none}.button-link{justify-self:start} }
  </style>
  <link rel="stylesheet" href="apocalypse-kit.css">
  <link rel="stylesheet" href="apocalypse-comm.css">
  <link rel="stylesheet" href="download-tracker.css">
  <link rel="stylesheet" href="offline-rag-readiness.css">
</head>
<body class="ap-page">
  <header><span class="apocalypse-icon" aria-hidden="true">☢</span><div class="header-copy"><span class="kit-brand"><img class="kit-brand-logo" src="../../icons/icon128.png" alt="" aria-hidden="true"><span class="kit-brand-name">WebBrain</span></span><h1 data-i18n="ap.title"></h1><p class="muted" data-i18n="ap.subtitle"></p></div><div class="header-right"><div class="header-stats" data-i18n-aria-label="ap.metric.summary"><span class="header-stat"><strong id="installed-count">0</strong><small data-i18n="ap.metric.installed"></small></span><span class="header-stat"><strong id="archive-bytes">0 B</strong><small data-i18n="ap.metric.archive_bytes"></small></span><span class="header-stat"><strong id="storage-usage"></strong><small data-i18n="ap.metric.storage"></small></span></div><span id="models-readiness" class="models-readiness" data-kind="disabled" role="status" aria-live="polite"><span class="models-readiness-dot" aria-hidden="true"></span><span id="models-readiness-label"></span></span></div></header>
  <main>
    <section class="card hero">
      <div class="hero-overview">
        <div class="hero-copy">
          <h2 data-i18n="ap.hero.title"></h2>
          <p class="muted" data-i18n="ap.hero.desc"></p>
          <p class="warning" data-i18n="ap.hero.consent"></p>
        </div>
        <label class="toggle"><input id="enabled" type="checkbox"> <span data-i18n="ap.enabled"></span></label>
      </div>
      <div class="local-models">
          <section id="webgpu-provider-card" class="local-model" data-model-kind="text" hidden>
            <span class="local-model-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M5 6.5h14M12 6.5v11M8.5 17.5h7"/></svg>
            </span>
            <div class="local-model-body">
              <div class="local-model-head">
                <strong data-i18n="ap.models.text.title"></strong>
                <span class="meta" data-webgpu-text-size>1.87 GB · WebGPU</span>
              </div>
              <div class="webgpu-text-presets" role="radiogroup" aria-label="Local text model">
                <label class="webgpu-text-preset">
                  <input type="radio" name="webgpu-text-preset" value="webbrain-one/webbrain-compass-tiny-v2.1" data-webgpu-text-preset checked>
                  <span>Compass Tiny v2.1</span>
                </label>
                <label class="webgpu-text-preset">
                  <input type="radio" name="webgpu-text-preset" value="webbrain-one/webbrain-compass-tiny-xs-v3-onnx" data-webgpu-text-preset>
                  <span>Compass Tiny XS v3 · FP16 · 4K</span>
                </label>
              </div>
              <p class="meta" data-webgpu-text-warning hidden data-i18n="ap.models.text.bonsai_warning"></p>
              <p class="meta" data-webgpu-text-copy data-i18n="ap.webgpu.rag"></p>
              <section class="webgpu-transfer" data-webgpu-download-panel data-state="checking" data-indeterminate="true" aria-labelledby="webgpu-transfer-title">
                <div class="webgpu-transfer-heading">
                  <span class="webgpu-transfer-title" id="webgpu-transfer-title" data-i18n="st.providers.webgpu_download.title"></span>
                </div>
                <div class="webgpu-transfer-status-row" role="status" aria-live="polite">
                  <span class="webgpu-transfer-dot" aria-hidden="true"></span>
                  <span class="webgpu-transfer-status" data-webgpu-download-status></span>
                </div>
                <div class="webgpu-transfer-track" data-webgpu-download-track role="progressbar" data-i18n-aria-label="st.providers.webgpu_download.progress_label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                  <div class="webgpu-transfer-fill" data-webgpu-download-fill></div>
                </div>
                <div class="webgpu-transfer-detail" data-webgpu-download-detail></div>
                <div class="webgpu-transfer-actions">
                  <button type="button" class="primary" data-webgpu-download-action="start" data-i18n="st.providers.webgpu_download.start"></button>
                  <button type="button" data-webgpu-download-action="pause" data-i18n="st.providers.webgpu_download.pause" hidden></button>
                  <button type="button" class="primary" data-webgpu-download-action="resume" data-i18n="st.providers.webgpu_download.resume" hidden></button>
                  <button type="button" data-webgpu-download-action="stop" data-i18n="st.providers.webgpu_download.stop" hidden></button>
                </div>
              </section>
            </div>
          </section>

          <section id="vision-model-card" class="local-model" data-model-kind="vision" hidden>
            <span class="local-model-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
            </span>
            <div class="local-model-body">
              <div class="local-model-head"><strong data-i18n="ap.models.vision.title"></strong><span class="meta">~810 MB · WebGPU</span></div>
              <p class="meta" data-i18n="st.vision.local.desc"></p>
              <p class="meta" data-i18n="ap.vision.auto"></p>
              <div id="vision-model-status" class="vision-status" role="status" aria-live="polite"></div>
              <progress id="vision-model-progress" max="100" value="0" hidden></progress>
              <div class="model-actions">
                <button type="button" class="primary" data-vision-download-action="start" data-i18n="st.providers.webgpu_download.start" hidden></button>
                <button type="button" data-vision-download-action="pause" data-i18n="st.providers.webgpu_download.pause" hidden></button>
                <button type="button" class="primary" data-vision-download-action="resume" data-i18n="st.providers.webgpu_download.resume" hidden></button>
                <button type="button" class="danger" data-vision-download-action="stop" data-i18n="st.providers.webgpu_download.stop" hidden></button>
                <button type="button" id="vision-model-test" data-i18n="st.vision.test" disabled></button>
              </div>
              <div id="vision-model-test-result" class="model-test-result" role="status" aria-live="polite"></div>
            </div>
          </section>

          <section id="basic-wikipedia-card" class="local-model" data-model-kind="knowledge" hidden>
            <span class="local-model-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M3.5 5.5h5.3c1.8 0 3.2 1.4 3.2 3.2v10.8c0-1.8-1.4-3.2-3.2-3.2H3.5V5.5ZM20.5 5.5h-5.3c-1.8 0-3.2 1.4-3.2 3.2v10.8c0-1.8 1.4-3.2 3.2-3.2h5.3V5.5Z"/></svg>
            </span>
            <div class="local-model-body">
              <div class="local-model-head"><strong id="basic-wikipedia-title" data-i18n="ap.models.wikipedia.title"></strong><span id="basic-wikipedia-meta" class="meta"></span></div>
              <p id="basic-wikipedia-description" class="meta" data-i18n="ap.models.wikipedia.desc"></p>
              <div id="basic-wikipedia-status" class="vision-status" role="status" aria-live="polite"></div>
              <progress id="basic-wikipedia-progress" max="100" value="0" hidden></progress>
              <div class="model-actions">
                <button type="button" id="basic-wikipedia-start" class="primary" data-i18n="st.providers.webgpu_download.start" hidden></button>
                <button type="button" data-basic-wikipedia-action="pause" data-i18n="ap.pause" hidden></button>
                <button type="button" class="primary" data-basic-wikipedia-action="resume" data-i18n="ap.resume" hidden></button>
                <button type="button" data-basic-wikipedia-action="retry" data-i18n="ap.retry" hidden></button>
                <button type="button" class="primary" data-basic-wikipedia-action="read" data-i18n="ap.reader.open" hidden></button>
                <button type="button" class="danger" data-basic-wikipedia-action="stop" data-i18n="st.providers.webgpu_download.stop" hidden></button>
              </div>
            </div>
          </section>
      </div>
    </section>

    <section id="wikipedia-library-callout" class="card library-callout" hidden>
      <span class="section-icon" data-kind="catalog" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 5.5h5.3c1.8 0 3.2 1.4 3.2 3.2v10.8c0-1.8-1.4-3.2-3.2-3.2H3.5V5.5ZM20.5 5.5h-5.3c-1.8 0-3.2 1.4-3.2 3.2v10.8c0-1.8 1.4-3.2 3.2-3.2h5.3V5.5Z"/></svg></span>
      <div><h2 data-i18n="wl.title"></h2><p class="muted" data-i18n="wl.choose_desc"></p></div>
      <a id="wikipedia-library-link" class="button-link" href="wikipedia-library.html" data-i18n="st.display.apocalypse_mode.manage"></a>
    </section>

    <section id="emergency-box-callout" class="card emergency-callout" data-locked="true" aria-disabled="true">
      <div class="emergency-callout-row">
